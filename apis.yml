aid: epsagon
name: Epsagon
description: Epsagon was an observability and application performance monitoring (APM) company, founded in 2017,
  that provided automated distributed tracing for serverless and containerized applications — AWS Lambda, Node.js,
  Python, Go, .NET, Ruby, and Java — correlating traces, metrics, and logs to help teams identify and fix problems
  fast without manual instrumentation. Epsagon was acquired by Cisco in 2021 and folded into Cisco's observability
  portfolio, after which the product was sunset. The epsagon.com developer surface (docs, dashboard, and API subdomains)
  no longer resolves. Its surviving public footprint is the github.com/epsagon organization and the first-party
  instrumentation SDKs still hosted on npm, PyPI, RubyGems, Go modules, NuGet, and Maven Central. This profile captures
  that remaining, verifiable footprint.
